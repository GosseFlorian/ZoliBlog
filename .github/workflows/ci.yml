# CI — ZoliBlog / Spring Boot + React admin
# Déclenché à chaque push et pull request

name: CI

on:
  push:
    branches:
      - main
      - 'partie-*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend — Maven build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: java_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d java_blog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialiser java_blog_test (schéma + seed)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d java_blog_test \
            -f src/test/resources/schema-test.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d java_blog_test \
            -f src/test/resources/data-test.sql

      - name: Spotless check
        run: ./mvnw -B spotless:check

      - name: SpotBugs
        run: ./mvnw -B spotbugs:check

      - name: Run tests
        run: ./mvnw -B test

  frontend-admin-build:
    name: Frontend back-office — Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests (if configured)
        run: npm run test --if-present

  frontend-site-build:
    name: Frontend front-office — Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests (if configured)
        run: npm run test --if-present

  doc-check:
    name: Documentation — fichiers présents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fichiers doc obligatoires
        run: |
          test -f README.md
          test -f docs/README-diataxis.md
          test -f docs/README-exploitation.md
          test -f docs/README-runbook.md
          test -f docs/README-api.md
          test -f docs/README-architecture.md
          test -f docs/adr/README-adr.md
