# CI — ZoliBlog / Spring Boot + React admin
# Déclenché à chaque push et pull request

name: CI

on:
  push:
    branches:
      - main
      - 'partie-*'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — qualité, tests et JAR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: java_blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d java_blog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-api/pom.xml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialiser java_blog_test (schéma + seed)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d java_blog_test \
            -f src/test/resources/blog-test.sql

      - name: Spotless check
        run: ./mvnw -B spotless:check

      - name: SpotBugs
        run: ./mvnw -B spotbugs:check

      - name: Tests (JaCoCo ≥ 80 %)
        run: ./mvnw -B test

      - name: Package JAR
        run: ./mvnw -B -DskipTests package

      - name: Publier artefact JAR
        uses: actions/upload-artifact@v4
        with:
          name: zoliblog-api-jar
          path: backend-api/target/java_blog-*.jar
          if-no-files-found: error
          retention-days: 14

  frontend-admin:
    name: Frontend admin — lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests with coverage (≥ 80 %)
        run: npm run test:coverage

  frontend-site:
    name: Frontend site — lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests with coverage (≥ 80 %)
        run: npm run test:coverage

  fronts-railway:
    name: Fronts — build monorepo (Railway)
    runs-on: ubuntu-latest
    needs:
      - frontend-admin
      - frontend-site
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build
        run: npm ci && npm run build

      - name: Vérifier les artefacts static
        run: |
          test -f site/dist/index.html
          test -f admin/dist/index.html

      - name: Smoke Express (server.js)
        run: |
          PORT=3456 npm start &
          sleep 3
          curl -sf http://127.0.0.1:3456/ | grep -qi html
          curl -sf http://127.0.0.1:3456/admin/ | grep -qi html

  doc-check:
    name: Documentation — fichiers présents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers doc obligatoires
        run: |
          test -f README.md
          test -f backend-api/src/main/resources/blog.sql
          test -f backend-api/src/test/resources/blog-test.sql
          test -f doc/README-diataxis.md
          test -f doc/README-exploitation.md
          test -f doc/README-deploiement.md
          test -f doc/README-runbook.md
          test -f doc/README-api.md
          test -f doc/README-architecture.md
          test -f doc/adr/README-adr.md
          test -f package.json
          test -f package-lock.json
          test -f server.js
