# CD — Fronts statiques (site + admin) sur GitHub Pages
# Déclenché après une CI réussie sur main

name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build fronts et publication Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Préparer .env.production (depuis le modèle versionné)
        run: |
          set -euo pipefail
          test -f .env.production.example || { echo "::error::.env.production.example manquant"; exit 1; }
          if grep -q 'CHANGE_ME' .env.production.example; then
            echo "::error::Remplacer VITE_API_URL dans .env.production.example par l’URL Render réelle, puis committer."
            exit 1
          fi
          grep -qE '^VITE_API_URL=https?://' .env.production.example || {
            echo "::error::VITE_API_URL invalide dans .env.production.example"
            exit 1
          }
          cp .env.production.example .env.production

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            admin/package-lock.json

      - name: Build site public
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Build back-office admin
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Assembler le site Pages (site + admin + 404 SPA)
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/admin
          cp -r site/dist/. deploy/
          cp site/dist/index.html deploy/404.html
          cp -r admin/dist/. deploy/admin/
          cp admin/dist/index.html deploy/admin/404.html
          echo "Arborescence publiée :"
          find deploy -maxdepth 2 -type f | head -20

      - name: Upload artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
