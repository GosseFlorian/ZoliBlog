spring:
  application:
    name: java_blog
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/java_blog}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

jwt:
  # Secret de signature — MINIMUM ~32 caractères pour HS256. En prod : variable d'environnement !
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 h en millisecondes

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

security:
  login-rate-limit:
    enabled: ${SECURITY_LOGIN_RATE_LIMIT_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
