<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>ZoliBlog</title>
    <!--
      GitHub Pages ne connaît que des VRAIS fichiers (index.html, assets…).
      Une URL comme /ZoliBlog/admin/articles n'existe pas sur le disque → le serveur
      renvoie cette page 404.html (une seule, à la racine du site publié).

      Sans ce script, GitHub servait l'index du SITE PUBLIC : au F5 on voyait la 404 du site.

      Ce script redirige tout de suite vers la bonne app (admin ou site) en passant
      le chemin dans la query (?/articles…) ; voir spa-path-restore.js dans chaque front.
    -->
    <script>
      (function () {
        // Préfixe du repo sur GitHub Pages (project site "ZoliBlog").
        var repo = "/ZoliBlog";
        var l = window.location;
        var path = l.pathname;
        var adminPrefix = repo + "/admin";

        // --- Back-office : /ZoliBlog/admin, /ZoliBlog/admin/articles, etc. ---
        if (path === adminPrefix || path.indexOf(adminPrefix + "/") === 0) {
          // Ex. /ZoliBlog/admin/articles → rest = "articles"
          var rest = path.slice(adminPrefix.length).replace(/^\//, "");
          // Cible : /ZoliBlog/admin/?/articles (admin/index.html + chemin en query)
          var target =
            adminPrefix +
            "/" +
            (rest ? "?/" + rest.replace(/&/g, "~and~") : "");
          if (l.search) {
            target += (rest ? "&" : "?") + l.search.slice(1).replace(/&/g, "~and~");
          }
          target += l.hash;
          l.replace(target);
          return;
        }

        // --- Site public : /ZoliBlog/tutut, /ZoliBlog/articles/3, etc. ---
        // segmentCount = 1 → on garde /ZoliBlog dans l'URL, le reste part en ?/…
        var segmentCount = 1;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(segmentCount)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
